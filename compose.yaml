services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enterprise
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d enterprise"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/enterprise
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      BOOTSTRAP_KEY: ${BOOTSTRAP_KEY:?Set BOOTSTRAP_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  migrate:
    build: .
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/enterprise
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      BOOTSTRAP_KEY: ${BOOTSTRAP_KEY:?Set BOOTSTRAP_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
volumes:
  postgres_data:
