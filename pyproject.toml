[project]
name = "enterprise-fastapi-starter"
version = "0.1.0"
description = "Modular multi-tenant REST API with FastAPI, PostgreSQL and RBAC"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=23,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "pytest-cov>=6,<8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
