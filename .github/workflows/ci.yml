name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: enterprise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d enterprise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:test-password@localhost:5432/enterprise_test
      TEST_DATABASE_URL: postgresql+psycopg://app:test-password@localhost:5432/enterprise_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-this-secret-is-not-used-for-production-123456
      BOOTSTRAP_KEY: ci-only-bootstrap-key-not-used-in-production-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
